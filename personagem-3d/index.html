<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Narrador 3D Vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday creator tool
   IDEA a vertical video studio: the 9:16 phone frame is the set, the panel is the director's desk
   PICTURE the live 3D narrator in a 9:16 frame, with TikTok-style captions burned in
   COLOUR charcoal studio #141317, warm paper ink, coral #ff5a3c record light, yellow #ffd23f caption highlight
   TYPE Anton for captions and titles + Figtree for the interface
   LAYOUT laptop: frame full height on the left, desk on the right; phone: frame first, desk below */
:root{color-scheme:dark;--bg:#141317;--panel:#1e1c22;--line:#34313a;--ink:#f2efe8;--mute:#a9a4b0;--rec:#ff5a3c;--hi:#ffd23f}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;height:100%;padding:20px max(5vw,16px,env(safe-area-inset-right,0px)) 20px max(5vw,16px,env(safe-area-inset-left,0px))}
.stage{height:calc(100svh - 40px);aspect-ratio:9/16;position:relative;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.stage canvas{width:100%;height:100%;display:block}
.recdot{position:absolute;top:14px;right:14px;background:var(--rec);color:#fff;font:800 13px Figtree;padding:4px 10px;border-radius:99px}
.desk{overflow-y:auto;max-width:620px;padding-right:4px}
h1{font:400 clamp(34px,4vw,48px)/1.05 Anton,Impact,sans-serif;letter-spacing:.005em;margin:4px 0 6px}
.lead{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input[type=text],textarea,select{width:100%;font:16px Figtree,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:170px;resize:vertical;line-height:1.45}
.f{margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px;margin-bottom:16px}
.sw{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.sw input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;font-size:15px}
input[type=range]{width:100%;accent-color:var(--hi)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
button{font:800 16px Figtree,sans-serif;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button.play{background:var(--hi);color:#1a1500;border-color:var(--hi)}
button.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
.note{font-size:13px;color:var(--mute);margin:0 0 14px}
.out{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.out video{width:120px;aspect-ratio:9/16;border-radius:8px;background:#000}
.out a{color:var(--hi);font-weight:800}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr);height:auto}.stage{height:auto;width:min(100%,calc(74svh*9/16));margin:0 auto}.desk{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <div class="stage"><canvas id="out" width="1080" height="1920"></canvas><div class="recdot" id="recdot" hidden>● GRAVANDO</div></div>
  <div class="desk">
    <h1>Narrador 3D para vídeos verticais</h1>
    <p class="lead">Escreva a história, escolha o visual do personagem e grave um vídeo 1080×1920 com legendas para TikTok e Reels.</p>
    <div class="btns">
      <button class="play" id="play">▶ Reproduzir</button>
      <button class="rec" id="rec">● Gravar vídeo</button>
    </div>
    <div class="out" id="out-box" hidden><video id="vid" controls playsinline muted></video><div><strong>Vídeo pronto.</strong><br><a id="dl" download="historia-vertical.webm">Baixar vídeo</a><p class="note" id="fmt"></p></div></div>
    <p class="note">A gravação salva só a imagem. Adicione sua voz ou uma narração no CapCut ou no próprio app.</p>
    <div class="f"><label for="title">Título no topo (gancho)</label><input type="text" id="title" value="O DIA EM QUE O HOMEM PISOU NA LUA"></div>
    <div class="f"><label for="story">História</label><textarea id="story">Era 20 de julho de 1969. Milhões de pessoas estavam grudadas na TV. A nave Apollo 11 tinha acabado de pousar na Lua! Então Neil Armstrong desceu a escada e disse: um pequeno passo para o homem, um salto gigante para a humanidade. Estima-se que cerca de 600 milhões de pessoas assistiram ao vivo. Você sabia disso? Comenta aí!</textarea></div>
    <div class="row">
      <label class="sw"><input type="color" id="skin" value="#f1c19c">Pele</label>
      <label class="sw"><input type="color" id="hair" value="#2b1b14">Cabelo</label>
      <label class="sw"><input type="color" id="shirt" value="#ff5a3c">Camisa</label>
      <label class="sw"><input type="color" id="pants" value="#2d3a5c">Calça</label>
    </div>
    <div class="row">
      <div><label for="hairStyle">Cabelo</label><select id="hairStyle"><option value="short">Curto</option><option value="long">Longo</option><option value="bald">Careca</option></select></div>
      <div><label for="theme">Cenário</label><select id="theme"><option value="mystery">Mistério (noite)</option><option value="news">Notícia (estúdio)</option><option value="sunny">Ensolarado</option></select></div>
    </div>
    <div class="row">
      <div><label for="speed">Velocidade da fala</label><input type="range" id="speed" min="0.6" max="1.5" step="0.05" value="1"></div>
      <div><label class="chk"><input type="checkbox" id="glasses"> Óculos</label><label class="chk"><input type="checkbox" id="voice"> Voz do navegador (só na prévia)</label></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const W = 1080, H = 1920, $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);

const THEMES = {
  mystery: {top: '#120c2e', bottom: '#4b1f6b', floor: '#2a1b44', rim: '#7c5cff', dots: '#b79cff', bar: '#7c5cff'},
  news:    {top: '#0d1a33', bottom: '#b3122e', floor: '#1d2438', rim: '#ff3b4f', dots: '#ffffff', bar: '#e01b35'},
  sunny:   {top: '#ffb347', bottom: '#ffe8a3', floor: '#f39c4a', rim: '#fff1c1', dots: '#ffffff', bar: '#ff5a3c'}
};

// ---------- Luzes ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x404060, 0.75); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(2.5, 5, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.1); rim.position.set(-3, 3, -4); scene.add(rim);

// ---------- Cenário ----------
let floor, dots = [];
function gradientTex(a, b) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function buildSet(name) {
  const th = THEMES[name];
  scene.background = gradientTex(th.top, th.bottom);
  rim.color.copy(lin(th.rim));
  if (floor) scene.remove(floor);
  floor = new THREE.Mesh(new THREE.CircleGeometry(2.4, 64), new THREE.MeshStandardMaterial({color: lin(th.floor), roughness: .9}));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  dots.forEach(d => scene.remove(d)); dots = [];
  let s = 7;
  const rnd = () => (s = s * 16807 % 2147483647) / 2147483647;
  const mat = new THREE.MeshBasicMaterial({color: lin(th.dots), transparent: true, opacity: .55});
  for (let i = 0; i < 34; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(.03 + rnd() * .07, 12, 8), mat);
    m.position.set((rnd() - .5) * 7, rnd() * 5.5, -2.5 - rnd() * 4);
    m.userData = {y: m.position.y, p: rnd() * 6.28, sp: .3 + rnd() * .6};
    scene.add(m); dots.push(m);
  }
}

// ---------- Personagem ----------
let char = null;
const lin = c => new THREE.Color(c).convertSRGBToLinear();
const mat = (c, r = .55) => new THREE.MeshStandardMaterial({color: lin(c), roughness: r});
function mesh(geo, m, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz);
  o.castShadow = true; return o;
}
function buildCharacter(o) {
  const g = new THREE.Group(), skin = mat(o.skin, .6), shirt = mat(o.shirt), pants = mat(o.pants, .7);
  const hair = mat(o.hair, .8), white = mat('#ffffff', .3), dark = mat('#1b1016', .4), shoe = mat('#222222', .5);
  // pernas e sapatos
  [-.2, .2].forEach(x => {
    g.add(mesh(new THREE.CylinderGeometry(.17, .15, .62, 20), pants, x, .36, 0));
    g.add(mesh(new THREE.SphereGeometry(.2, 20, 12), shoe, x, .07, .07, 1, .5, 1.4));
  });
  // tronco
  g.add(mesh(new THREE.CylinderGeometry(.5, .6, 1.05, 32), shirt, 0, 1.15, 0));
  g.add(mesh(new THREE.SphereGeometry(.5, 32, 16), shirt, 0, 1.66, 0, 1, .42, 1));
  g.add(mesh(new THREE.CylinderGeometry(.6, .6, .12, 32), pants, 0, .66, 0));
  g.add(mesh(new THREE.CylinderGeometry(.14, .16, .25, 16), skin, 0, 1.85, 0));
  // braços (pivô no ombro)
  const arms = [-1, 1].map(side => {
    const p = new THREE.Group(); p.position.set(side * .6, 1.62, 0);
    p.add(mesh(new THREE.CylinderGeometry(.13, .11, .8, 16), shirt, 0, -.4, 0));
    p.add(mesh(new THREE.SphereGeometry(.13, 16, 12), skin, 0, -.86, 0));
    g.add(p); return p;
  });
  // cabeça
  const head = new THREE.Group(); head.position.set(0, 2.45, 0); g.add(head);
  head.add(mesh(new THREE.SphereGeometry(.62, 48, 32), skin, 0, 0, 0, 1, 1.05, .95));
  [-1, 1].forEach(s => head.add(mesh(new THREE.SphereGeometry(.13, 16, 12), skin, s * .6, -.02, 0, .5, 1, .6)));
  head.add(mesh(new THREE.SphereGeometry(.07, 16, 12), skin, 0, -.07, .6));
  const cheekM = new THREE.MeshStandardMaterial({color: lin('#ff6b7d'), transparent: true, opacity: .5});
  [-1, 1].forEach(s => head.add(mesh(new THREE.SphereGeometry(.1, 16, 12), cheekM, s * .36, -.16, .47, 1, .6, .4)));
  const eyes = [-1, 1].map(s => {
    const e = new THREE.Group(); e.position.set(s * .22, .06, .5);
    e.add(mesh(new THREE.SphereGeometry(.14, 24, 16), white, 0, 0, 0, 1, 1.1, .6));
    const pupil = new THREE.Group(); pupil.position.z = .07;
    pupil.add(mesh(new THREE.SphereGeometry(.08, 20, 14), dark, 0, 0, 0, 1, 1, .5));
    pupil.add(mesh(new THREE.SphereGeometry(.025, 10, 8), white, .03, .035, .04));
    e.add(pupil); head.add(e); return {e, pupil};
  });
  const brows = [-1, 1].map(s => {
    const b = mesh(new THREE.BoxGeometry(.24, .05, .05), hair, s * .22, .22, .57);
    b.rotation.z = s * -.12; head.add(b); return b;
  });
  const mouth = new THREE.Group(); mouth.position.set(0, -.29, .53); head.add(mouth);
  const mouthIn = mesh(new THREE.SphereGeometry(.13, 24, 16), mat('#5a1424', .4), 0, 0, 0, 1, .1, .45);
  const tongue = mesh(new THREE.SphereGeometry(.07, 16, 10), mat('#e8546b', .5), 0, -.03, .02, 1, .5, .5);
  mouth.add(mouthIn, tongue);
  if (o.hairStyle !== 'bald') {
    const cap = mesh(new THREE.SphereGeometry(.66, 40, 20, 0, Math.PI * 2, 0, Math.PI * .5), hair, 0, .02, -.02, 1, 1.05, .98);
    cap.rotation.x = -.35; head.add(cap);
    [-.25, 0, .25].forEach((x, i) => head.add(mesh(new THREE.SphereGeometry(.2, 16, 12), hair, x, .42 - i % 2 * .03, .34, 1.2, .7, .9)));
    if (o.hairStyle === 'long') head.add(mesh(new THREE.SphereGeometry(.68, 32, 20), hair, 0, -.3, -.14, 1.02, 1.3, .85));
  }
  if (o.glasses) {
    const fm = mat('#111111', .3);
    [-1, 1].forEach(s => head.add(mesh(new THREE.TorusGeometry(.17, .022, 10, 32), fm, s * .22, .06, .6)));
    head.add(mesh(new THREE.BoxGeometry(.12, .025, .025), fm, 0, .08, .62));
  }
  return {g, head, eyes, brows, mouth: mouthIn, tongue, arms};
}
function rebuild() {
  if (char) scene.remove(char.g);
  char = buildCharacter({skin: $('skin').value, hair: $('hair').value, shirt: $('shirt').value, pants: $('pants').value,
    hairStyle: $('hairStyle').value, glasses: $('glasses').checked});
  scene.add(char.g);
}

// ---------- Roteiro e tempo ----------
let timeline = [], total = 0;
function buildTimeline() {
  const sp = +$('speed').value;
  const sentences = $('story').value.trim().split(/(?<=[.!?…])\s+/).filter(Boolean);
  timeline = []; let t = .6;
  sentences.forEach((s, si) => {
    const words = s.split(/\s+/);
    words.forEach((w, wi) => {
      const d = (.14 + .05 * w.replace(/\W/g, '').length) / sp;
      timeline.push({si, wi, w, start: t, end: t + d, words, gesture: si % 4});
      t += d + (/[,;:]$/.test(w) ? .18 / sp : 0);
    });
    t += .45 / sp;
  });
  total = t + .8;
}
function wordAt(t) {
  let cur = null;
  for (const e of timeline) { if (e.start <= t) cur = e; else break; }
  return cur;
}

// ---------- Desenho 2D (título + legendas) ----------
function wrapLines(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  });
  if (line) lines.push(line); return lines;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawTitle() {
  const txt = $('title').value.trim().toUpperCase(); if (!txt) return;
  ctx.font = '76px Anton, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lines = wrapLines(txt, 860).slice(0, 3), lh = 92, h = lines.length * lh + 50;
  const w = Math.min(980, Math.max(...lines.map(l => ctx.measureText(l).width)) + 90);
  ctx.fillStyle = THEMES[$('theme').value].bar; roundRect((W - w) / 2, 150, w, h, 28); ctx.fill();
  ctx.fillStyle = '#ffffff';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 150 + 25 + lh / 2 + i * lh + 4));
}
function drawCaption(e) {
  if (!e) return;
  const start = Math.floor(e.wi / 4) * 4, chunk = e.words.slice(start, start + 4);
  ctx.font = '96px Anton, Impact, sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = '#000';
  // monta linhas mantendo a palavra atual destacada
  const lines = [[]]; let lw = 0; const space = ctx.measureText(' ').width;
  chunk.forEach((w, i) => {
    const ww = ctx.measureText(w.toUpperCase()).width;
    if (lw + ww > 940 && lines[lines.length - 1].length) { lines.push([]); lw = 0; }
    lines[lines.length - 1].push({w: w.toUpperCase(), ww, cur: start + i === e.wi}); lw += ww + space;
  });
  const y0 = 1470 - (lines.length - 1) * 56;
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, b) => a + b.ww, 0) + space * (ln.length - 1);
    let x = (W - tw) / 2; const y = y0 + li * 112;
    ln.forEach(o => {
      const sc = o.cur ? 1.08 : 1;
      ctx.save(); ctx.translate(x + o.ww / 2, y); ctx.scale(sc, sc);
      ctx.strokeText(o.w, -o.ww / 2, 0); ctx.fillStyle = o.cur ? '#ffd23f' : '#ffffff'; ctx.fillText(o.w, -o.ww / 2, 0);
      ctx.restore(); x += o.ww + space;
    });
  });
}

// ---------- Animação ----------
let playing = false, t0 = 0, lastSi = -1, mouthOpen = 0, nextBlink = 2, blinkAt = -1, armT = [[0, 0], [0, 0]];
const lerp = (a, b, k) => a + (b - a) * k;
function mouthTarget(e, t) {
  if (!e || t > e.end) return 0;
  const letters = e.w.replace(/[^\p{L}]/gu, '').toLowerCase(); if (!letters) return 0;
  const ch = letters[Math.min(letters.length - 1, Math.floor((t - e.start) / (e.end - e.start) * letters.length))];
  if ('aáàâã'.includes(ch)) return 1; if ('eéêioóôõuú'.includes(ch)) return .65;
  if ('mbp'.includes(ch)) return .05; return .3;
}
function speak(text) {
  if (!$('voice').checked || !window.speechSynthesis) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR'; u.rate = +$('speed').value; speechSynthesis.speak(u); } catch (_) {}
}
function frame(now) {
  const time = now / 1000, t = playing ? time - t0 : -1;
  const e = playing ? wordAt(t) : null, talking = e && t <= e.end + .25;
  if (playing && e && e.si !== lastSi) { lastSi = e.si; speak(e.words.join(' ')); }
  if (playing && t > total) stop();
  // boca
  mouthOpen = lerp(mouthOpen, playing ? mouthTarget(e, t) : 0, .45);
  char.mouth.scale.y = .1 + mouthOpen * .55; char.tongue.visible = mouthOpen > .4;
  // piscar
  if (time > nextBlink) { blinkAt = time; nextBlink = time + 2.5 + Math.random() * 3; }
  const blinkPhase = time - blinkAt < .14 ? .1 : 1;
  char.eyes.forEach(o => { o.e.scale.y = lerp(o.e.scale.y, blinkPhase, .6); o.pupil.position.x = Math.sin(time * .7) * .025; });
  // sobrancelhas: sobem em exclamação ou pergunta
  const excited = e && /[!?]/.test(e.words.join(' ')) ? .06 : 0;
  char.brows.forEach(b => b.position.y = lerp(b.position.y, .22 + excited + (talking ? Math.sin(time * 6) * .01 : 0), .2));
  // cabeça e corpo
  char.head.rotation.x = talking ? Math.sin(time * 7) * .04 : Math.sin(time * 1.3) * .02;
  char.head.rotation.y = Math.sin(time * .6) * .12; char.head.rotation.z = Math.sin(time * .9) * .04;
  char.g.position.y = Math.sin(time * 2) * .015; char.g.rotation.y = Math.sin(time * .4) * .08;
  // gestos dos braços por frase
  const gs = talking ? e.gesture : -1, wave = Math.sin(time * 5) * .12;
  const targets = gs === 1 ? [[-.2, .15], [-1.3 + wave, -.5]] : gs === 2 ? [[-.7 + wave, .7], [-.7 - wave, -.7]]
    : gs === 3 ? [[-1.1 + wave, .3], [-.15, -.15]] : [[0, .12], [0, -.12]];
  char.arms.forEach((a, i) => {
    armT[i][0] = lerp(armT[i][0], targets[i][0], .08); armT[i][1] = lerp(armT[i][1], targets[i][1], .08);
    a.rotation.x = armT[i][0] + Math.sin(time * 2 + i) * .03; a.rotation.z = armT[i][1];
  });
  // fundo
  dots.forEach(d => { d.position.y = d.userData.y + Math.sin(time * d.userData.sp + d.userData.p) * .25; });
  // câmera: aproximação lenta durante a história
  const push = playing ? Math.min(1, t / Math.max(total, 1)) : 0;
  camera.position.set(Math.sin(time * .3) * .15, 1.95, 11.2 - push * 1.8); camera.lookAt(0, 1.55, 0);
  renderer.render(scene, camera);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  drawTitle(); if (talking) drawCaption(e);
  requestAnimationFrame(frame);
}

// ---------- Controles ----------
let rec = null, chunks = [];
function play() {
  buildTimeline(); if (window.speechSynthesis) speechSynthesis.cancel();
  playing = true; lastSi = -1; t0 = performance.now() / 1000; $('play').textContent = '■ Parar';
}
function stop() {
  playing = false; $('play').textContent = '▶ Reproduzir';
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (rec && rec.state === 'recording') rec.stop();
}
$('play').onclick = () => playing ? stop() : play();
$('rec').onclick = () => {
  if (rec && rec.state === 'recording') { stop(); return; }
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t));
  if (!type) { $('fmt').textContent = 'Este navegador não grava vídeo. Use o Chrome ou o Edge.'; $('out-box').hidden = false; return; }
  chunks = []; rec = new MediaRecorder(out.captureStream(30), {mimeType: type, videoBitsPerSecond: 8e6});
  rec.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, {type}), url = URL.createObjectURL(blob), ext = type.includes('mp4') ? 'mp4' : 'webm';
    $('vid').src = url; $('dl').href = url; $('dl').download = 'historia-vertical.' + ext;
    $('fmt').textContent = ext === 'mp4' ? 'Formato MP4, pronto para postar.' : 'Formato WebM. Se o app não aceitar, converta para MP4 (ex.: CapCut ou cloudconvert).';
    $('out-box').hidden = false; $('recdot').hidden = true; $('rec').textContent = '● Gravar vídeo';
  };
  rec.start(); $('recdot').hidden = false; $('rec').textContent = '■ Parar gravação'; play();
};
['skin', 'hair', 'shirt', 'pants', 'hairStyle', 'glasses'].forEach(id => $(id).addEventListener('input', rebuild));
$('theme').addEventListener('input', () => buildSet($('theme').value));

buildSet('mystery'); rebuild();
const go = () => requestAnimationFrame(frame);
document.fonts && document.fonts.load('96px Anton').then(go, go) || go();
}
</script>
